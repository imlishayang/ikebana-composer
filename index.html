<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ikebana Composer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap">
    <link rel="stylesheet" href="style.css?v=6">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1 class="ikebana">Ikebana composer</h1>
      <p>Where flowers become poetry</p>
    </header>

    <div class="app">
      <aside>
        <section class="picker-group" aria-labelledby="vessel-heading">
          <h2 id="vessel-heading">Vessel</h2>
          <div class="vs" id="vs"></div>
        </section>
        <section class="picker-group" aria-labelledby="stem-heading">
          <h2 id="stem-heading">Stems</h2>
          <div class="grid" id="lib"></div>
        </section>
      </aside>

      <main>
        <svg id="cv" viewBox="0 0 600 700" role="img" tabindex="0" aria-label="Arrangement canvas. Arrow keys move the selected stem; Shift and arrow keys bend it.">
          <defs>
            <filter id="contact-shadow" x="-30%" y="-100%" width="160%" height="300%">
              <feGaussianBlur stdDeviation="5"></feGaussianBlur>
            </filter>
          </defs>
          <g id="lay"></g>
        </svg>
        <div class="tb">
          <button class="history-button" data-a="undo" aria-label="Undo" title="Undo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h9a7 7 0 0 1 7 7v2"></path></svg>
          </button>
          <button class="history-button" data-a="redo" aria-label="Redo" title="Redo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5m5 5h-9a7 7 0 0 0-7 7v2"></path></svg>
          </button>
          <button data-a="del">Remove stem</button>
          <div class="clear-wrap">
            <button id="clear-all" data-a="clear" aria-controls="clear-confirm" aria-haspopup="dialog" aria-expanded="false">Clear all</button>
            <div id="clear-confirm" class="clear-confirm" role="alertdialog" aria-labelledby="clear-confirm-title" hidden>
              <p id="clear-confirm-title">Clear everything?</p>
              <div class="clear-confirm-actions">
                <button type="button" data-a="confirm-clear">Yes</button>
                <button type="button" data-a="cancel-clear">Cancel</button>
              </div>
            </div>
          </div>
          <button id="save-image" type="button">Save image</button>
        </div>
        <p class="hint">Drag to place, aim, or bend.</p>
      </main>
    </div>
  </body>
</html>
