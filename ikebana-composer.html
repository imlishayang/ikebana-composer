<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ikebana Composer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap">
    <link rel="stylesheet" href="ikebana-composer.css?v=5">
    <script src="ikebana-composer.js" defer></script>
  </head>
  <body>
    <header>
      <h1 class="ikebana">Ikebana composer</h1>
      <p>Where flowers become poetry</p>
    </header>

    <div class="app">
      <aside>
        <section class="picker-group" aria-labelledby="vessel-heading">
          <h2 id="vessel-heading">Vessel</h2>
          <div class="vs" id="vs"></div>
        </section>
        <section class="picker-group" aria-labelledby="stem-heading">
          <h2 id="stem-heading">Stems</h2>
          <div class="grid" id="lib"></div>
        </section>
      </aside>

      <main>
        <svg id="cv" viewBox="0 0 600 700" role="img" tabindex="0" aria-label="Arrangement canvas. Arrow keys move the selected stem; Shift and arrow keys bend it.">
          <g id="lay"></g>
        </svg>
        <div class="tb">
          <button data-a="undo">Undo</button>
          <button id="clear-all" data-a="clear" aria-controls="clear-confirm" aria-expanded="false">Clear all</button>
          <button data-a="del">Remove stem</button>
          <span id="clear-confirm" class="clear-confirm" role="group" aria-label="Confirm clearing all stems" hidden>
            <span>Clear everything?</span>
            <button type="button" data-a="confirm-clear">Yes</button>
            <button type="button" data-a="cancel-clear">Cancel</button>
          </span>
            <button id="save-image" type="button">Save image</button>
        </div>
        <p class="hint">Drag to place, aim, or bend.</p>
      </main>
    </div>
  </body>
</html>
