<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ikebana Composer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap">
    <link rel="stylesheet" href="ikebana-composer.css">
    <script src="ikebana-composer.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Ikebana composer</h1>
      <p>Choose a vessel, set one strong line, then let the space speak.</p>
    </header>

    <div class="app">
      <aside>
        <h2>Vessel</h2>
        <div class="vs" id="vs"></div>

        <h2>Stems</h2>
        <div class="grid" id="lib"></div>
      </aside>

      <main>
        <div class="tb">
          <button data-a="undo">Undo</button>
          <button data-a="color">Change color</button>
          <button data-a="big">Larger</button>
          <button data-a="small">Smaller</button>
          <button data-a="fwd">Bring forward</button>
          <button data-a="back">Send back</button>
          <button data-a="dup">Duplicate</button>
          <button data-a="del">Remove</button>
          <button data-a="clear">Clear all</button>
        </div>

        <svg id="cv" viewBox="0 0 600 700" role="img" aria-label="Arrangement canvas">
          <rect width="600" height="700" style="fill: var(--stage)"></rect>
          <g id="lay"></g>
        </svg>
        <p class="hint">Drag a stem onto the canvas, or tap it to add. Drag a flower to aim it, and drag the filled dot to bend the stem.</p>
      </main>
    </div>
  </body>
</html>
